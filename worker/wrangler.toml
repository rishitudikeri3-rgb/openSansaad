# Chat router for the static demo: `make chat-worker` (deploy), `make chat-worker-key` (secret).
name = "opensansad-chat"
main = "chat.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
SITE_URL = "https://rishitudikeri3-rgb.github.io/openSansaad/"
ALLOWED_ORIGIN = "https://rishitudikeri3-rgb.github.io"
LLM_BASE_URL = "https://api.groq.com/openai/v1"
MODEL_BULK = "openai/gpt-oss-20b"
MODEL_REASONING = "openai/gpt-oss-120b"
# LLM_API_KEY is a secret, never in this file
