<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSansad</title>
<meta name="description" content="How India's arbitration law changed in 2015, 2019 and 2021, and who said why, in plain words.">
<style>
:root { --bg:#f7f5f0; --fg:#1d1c1a; --muted:#66635b; --line:#e2ded4; --card:#ffffff; --soft:#f0ede5;
        --accent:#b4532a; --accent-soft:#f8e8de;
        --add:#2f7d4f; --add-soft:#e3f2e8; --chg:#a8650f; --chg-soft:#fbefd9; --del:#b03a3a; --del-soft:#f8e1e1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#151513; --fg:#eceae4; --muted:#a3a097; --line:#34332f; --card:#1f1e1c; --soft:#272622;
  --accent:#e58a5f; --accent-soft:#3a2a21;
  --add:#6cc08a; --add-soft:#1e3326; --chg:#e0a24f; --chg-soft:#3a2d17; --del:#e07a7a; --del-soft:#3a1f1f; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color:var(--accent); }
button { font:inherit; color:inherit; }
.wrap { max-width:760px; margin:0 auto; padding:0 16px; }
header { border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
header .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; height:62px; }
.brand { font-weight:700; font-size:20px; text-decoration:none; color:var(--fg); }
.brand span { color:var(--accent); }
.mode { display:flex; background:var(--soft); border-radius:12px; padding:3px; }
.mode button { border:0; background:none; padding:6px 14px; border-radius:9px; cursor:pointer; font-size:15px; color:var(--muted); }
.mode button[aria-pressed="true"] { background:var(--card); color:var(--fg); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }

.hero { padding:36px 0 4px; }
.hero h1 { font-size:clamp(30px, 6vw, 44px); line-height:1.15; margin:0 0 14px; letter-spacing:-.02em; }
.hero p { margin:0; font-size:19px; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-top:22px; }
.card h3 { margin:0 0 6px; font-size:19px; }
.card p { margin:0; }
.card p + p { margin-top:10px; }
.steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:22px; }
.step { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center; font-size:16px; }
.step b { display:block; font-size:30px; line-height:1.2; }
.search { margin:30px 0 4px; }
.search input { width:100%; padding:16px 18px; font:inherit; border:2px solid var(--line); border-radius:14px;
  background:var(--card); color:var(--fg); }
.search input:focus { outline:none; border-color:var(--accent); }
h2 { font-size:24px; margin:36px 0 14px; letter-spacing:-.01em; }
.qs { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:12px; }
.q { display:flex; gap:14px; align-items:flex-start; text-align:left; background:var(--card); border:2px solid var(--line);
  border-radius:16px; padding:16px; cursor:pointer; transition:border-color .15s, transform .15s; }
.q:hover, .q:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
.q .ic { font-size:30px; line-height:1; flex:none; }
.q b { display:block; font-size:18px; line-height:1.3; margin-bottom:4px; }
.q span { color:var(--muted); font-size:15px; }
.key { display:grid; gap:10px; }
.key div { display:flex; gap:12px; align-items:flex-start; }
.key .ic { font-size:24px; line-height:1.3; flex:none; width:30px; text-align:center; }
.list { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:12px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left;
  background:none; border:0; border-top:1px solid var(--line); padding:13px 16px; cursor:pointer; font-size:16px; }
.row:first-child { border-top:0; }
.row:hover { background:var(--soft); }
.row span.t span { color:var(--muted); }
.tag { flex:none; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:10px; padding:3px 10px; }
.tag.added { background:var(--add-soft); color:var(--add); }
.tag.changed { background:var(--chg-soft); color:var(--chg); }
.tag.removed { background:var(--del-soft); color:var(--del); }
.tag.never { background:var(--soft); color:var(--muted); }
.empty { padding:16px; color:var(--muted); }
.switch { margin-top:30px; text-align:center; }
.switch button { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px 18px; cursor:pointer; font-size:16px; }
.switch button:hover { border-color:var(--accent); }

.back { margin:22px 0 6px; background:none; border:0; color:var(--accent); cursor:pointer; padding:6px 0; font-size:17px; }
.title { display:flex; gap:14px; align-items:flex-start; }
.title .ic { font-size:40px; line-height:1.1; }
.title h1 { font-size:clamp(26px, 5vw, 36px); margin:0; line-height:1.2; letter-spacing:-.01em; }
.title .sub { color:var(--muted); font-size:16px; margin-top:4px; }
.story { font-size:20px; margin:18px 0 0; }
.path { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:22px 0 6px; }
.path .arrow { color:var(--muted); }
.yr { font-weight:700; font-size:28px; margin:30px 0 8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; }
.yr .tag { font-size:13px; }
.yr small { font-weight:400; font-size:15px; color:var(--muted); }
.what { font-size:20px; font-weight:500; }
.why { margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
.why .lab { font-size:16px; font-weight:700; margin-bottom:8px; }
.why .who { display:flex; gap:10px; align-items:flex-start; font-size:17px; }
.why .who .ic { font-size:24px; line-height:1.2; }
.why .simple { margin-top:10px; font-size:20px; line-height:1.5; }
.why .quote { margin:12px 0 0; padding:12px 16px; background:var(--soft); border-left:4px solid var(--accent);
  border-radius:0 10px 10px 0; font-size:17px; }
.why .short { margin-top:10px; font-size:16px; color:var(--muted); }
.why .from { margin-top:10px; font-size:14px; color:var(--muted); }
.why.none .quote { border-left-color:var(--line); color:var(--muted); }
details.text { margin-top:14px; }
details.text summary { cursor:pointer; color:var(--accent); font-size:16px; }
details.text .txt { white-space:pre-wrap; font-size:14px; color:var(--muted); margin-top:8px; max-height:320px; overflow:auto;
  background:var(--soft); border-radius:10px; padding:10px 12px; font-family:ui-serif, Georgia, serif; }
footer { color:var(--muted); font-size:15px; padding:30px 0 50px; border-top:1px solid var(--line); margin-top:44px; }
.chat-btn { position:fixed; right:16px; bottom:16px; z-index:20; border:0; border-radius:999px; padding:13px 20px;
  background:var(--accent); color:#fff; font-size:17px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.2); }
.chat { position:fixed; right:16px; bottom:16px; z-index:21; width:min(400px, calc(100vw - 32px)); height:min(560px, calc(100vh - 100px));
  display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.25); overflow:hidden; }
.chat[hidden] { display:none; }
.chat .top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:700; }
.chat .top button { border:0; background:none; font-size:22px; cursor:pointer; color:var(--muted); }
.chat .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; font-size:16px; line-height:1.5; }
.chat .m { max-width:92%; padding:10px 13px; border-radius:14px; }
.chat .m.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.chat .m.bot { align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px; }
.chat .m.bot p { margin:6px 0 0; } .chat .m.bot p:first-child { margin-top:0; }
.chat .m.bot .r { color:var(--muted); font-size:15px; }
.chat .m.bot a { cursor:pointer; font-weight:600; }
.chat .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chat .chips button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 10px; font-size:14px; cursor:pointer; }
.chat form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
.chat input { flex:1; min-width:0; padding:10px 12px; font:inherit; font-size:16px; border:2px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); }
.chat input:focus { outline:none; border-color:var(--accent); }
.chat form button { border:0; border-radius:12px; padding:0 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.chat .note { font-size:12px; color:var(--muted); padding:0 12px 8px; }
@media (max-width:560px) { .steps { grid-template-columns:1fr; } .step { display:flex; gap:12px; align-items:center; text-align:left; }
  .step b { font-size:24px; } .mode button { padding:6px 10px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#">Open<span>Sansad</span></a>
  <div class="mode" role="group" aria-label="How much detail">
    <button data-mode="easy">😊 Easy</button><button data-mode="full">📚 Full</button>
  </div>
</div></header>

<main class="wrap" id="app"><p style="padding:40px 0;color:var(--muted)">Loading…</p></main>

<div class="wrap"><footer>
  We never make up a reason. Every reason comes word for word from an official record,
  and we always say who said it. If we can't find one, we tell you.
  <a href="https://github.com/rishitudikeri3-rgb/openSansaad#readme">How this works</a>
</footer></div>

<button class="chat-btn" id="chat-open">💬 Ask</button>
<section class="chat" id="chat" hidden aria-label="Ask a question">
  <div class="top"><span>💬 Ask about this law</span><button id="chat-close" aria-label="Close">×</button></div>
  <div class="msgs" id="chat-msgs"></div>
  <form id="chat-form"><input id="chat-in" maxlength="300" placeholder="Type your question…" aria-label="Your question" autocomplete="off"><button>Send</button></form>
  <div class="note" id="chat-note">I only repeat what the official record says. I never make up a reason.</div>
</section>

<script>
// questions people actually ask, each pointing at the part of the law that answers it
const QUESTIONS = [
  ["s29A", "⏱️", "Is there a time limit to finish a case?", "Yes, since 2015"],
  ["s12", "🤨", "What if the arbitrator is unfair?", "Rules to keep them neutral"],
  ["sch8", "🎓", "Who can be an arbitrator?", "A list added in 2019, then removed in 2021"],
  ["s34", "🚫", "Can a court cancel the decision?", "When a court can throw it out"],
  ["s37", "↩️", "Can I challenge a decision in a higher court?", "What you are allowed to appeal"],
  ["s11", "👉", "Who picks the arbitrator if we can't agree?", "When the two sides can't decide"],
  ["s36", "✅", "When must the losing side obey the decision?", "Making the decision count"],
  ["s31A", "💰", "Who pays the costs?", "Added in 2015"],
  ["s42A", "🔒", "Is the case kept secret?", "Added in 2019"],
  ["s29B", "⚡", "Is there a faster option?", "A quick route, added in 2015"],
  ["s17", "⏸️", "Can the arbitrator give orders before the end?", "Temporary orders while the case runs"],
  ["pt1A", "🏛️", "What is the Arbitration Council?", "A new body that rates arbitration centres"],
];
// plain names for parts added after 1996 whose heading the data does not carry
const TITLES = {
  pt1A: "Arbitration Council of India", s11A: "Government can change the fee list", s29A: "Deadline for the decision",
  s31A: "Who pays the costs", s42A: "Keeping the case private", s87: "Which cases the 2015 changes apply to",
  "s43-I": "Rules for grading arbitration centres", sch4: "List of fees for arbitrators",
  sch5: "Reasons to doubt an arbitrator is fair", sch6: "Form where an arbitrator declares any links to the sides",
  sch7: "Links that stop someone being an arbitrator", sch8: "Who can be an arbitrator",
};
// Easy view only: legal phrases in the checked reasons swapped for everyday words, longest first.
// The exact quote is always one tap away, and Full view shows the reason as recorded.
const PLAIN = [
  ["make disposal of commercial disputes more user-friendly and cost effective", "make settling business disputes simpler and cheaper"],
  ["to achieve faster disposal of cases", "to settle cases faster"],
  ["The amendments proposed in the Bill will ensure that", "The changes will make sure that"],
  [/^The amendments? (?:is intended to|aims to|seeks? to|was made to|was introduced to)/, "This was done to"],
  [/^The amendment was recommended to/, "This was recommended to"],
  [/^The amendment ensures that/, "This makes sure that"], [/^The amendment rationalizes/, "This simplifies"],
  [/^The amendment (?:inserts|adds)/, "This adds"], [/^To empower/, "To allow"],
  ["the Central Government to amend the Fourth Schedule by notification in the Official Gazette after laying the same in draft form before each House of Parliament",
   "the Government to change the arbitrators' fee list by official notice, after first showing a draft to both Houses of Parliament"],
  ["exercise jurisdiction to grant interim measures, etc.,", "give temporary orders"],
  ["even where the seat of the arbitration is outside India", "even when the arbitration takes place outside India"],
  ["align Indian law with the UNCITRAL Model Law", "match Indian law to the United Nations' model arbitration law"],
  ["permit arbitration agreements to be concluded through electronic communication", "allow arbitration agreements to be made by email or other electronic means"],
  ["eliminate the inconvenience caused by interim ex parte orders passed in original applications", "stop the trouble caused by temporary orders made without hearing the other side"],
  ["provides greater incentive for the High Court and/or Supreme Court to delegate the power of appointment to specialized, external persons or institutions",
   "encourages the High Court and Supreme Court to let outside experts or arbitration centres choose arbitrators"],
  ["ensure neutrality of arbitrators", "make sure arbitrators don't take sides"],
  ["empower the arbitral tribunal to grant interim measures that the court can grant, making such orders enforceable as court orders",
   "let the arbitrator give the same temporary orders a court can, and make those orders count like court orders"],
  ["contract enforcement", "enforcing contracts"],
  ["the default rate of interest reflects prevailing commercial realities instead of an arbitrary 18% rate", "the standard interest rate follows real market rates instead of a fixed 18%"],
  ["provide detailed provisions for the regime of costs that can be determined and ordered by the Court or arbitral tribunal", "set clear rules on who pays the costs, decided by the court or the arbitrator"],
  ["Explanation 2 to clarify that the test for contravention of fundamental Indian law will not involve a review of the dispute’s merits",
   "a note making clear that when a court checks whether a decision breaks basic Indian law, it will not decide the whole dispute again"],
  ["change the definition of “Court” so that for international commercial arbitrations the Court will be the High Court", "make sure international business cases go to a High Court"],
  ["minimise the need to approach the courts for appointment of arbitrators", "reduce the need to go to court just to get an arbitrator appointed"],
  ["reduce reliance on courts for appointing arbitrators", "rely less on courts to pick arbitrators"],
  ["the statement of claim and defence is completed within six months of the arbitrator’s appointment", "both sides hand in their written cases within six months of the arbitrator being appointed"],
  ["protect arbitrators from suits or other legal proceedings for actions or omissions done in good faith during arbitration", "protect arbitrators from being sued for honest decisions made during a case"],
  ["clarify that section 26 of the 2015 Amendment Act applies only to arbitral proceedings commenced on or after 23 October 2015 and to the court proceedings arising from them",
   "make clear that the 2015 changes apply only to cases started on or after 23 October 2015 (and court cases coming from them)"],
  ["a new Part 1A to establish", "a new part to set up"],
  ["address corrupt practices in securing contracts or arbitral awards by allowing parties to seek an unconditional stay of enforcement where the award is induced by fraud or corruption",
   "fight corruption, by letting a side ask for a decision to be put on hold if it was won through fraud or bribery"],
  ["lay down norms and qualifications by way of regulations for the purpose of accreditation of arbitrators", "set the rules and qualifications for approving arbitrators"],
  ["institutional arbitration", "arbitration run by professional centres"],
  ["grading arbitral institutions and accrediting arbitrators", "rating arbitration centres and approving arbitrators"],
  ["expeditious disposal of cases", "cases being settled faster"], ["faster disposal of cases", "settling cases faster"],
  ["disposal of commercial disputes", "settling business disputes"], ["commercial disputes", "business disputes"],
  ["international commercial arbitration", "international business arbitration"], ["eminent arbitrators", "top arbitrators"],
  ["a hub of", "a centre for"], ["a hub for", "a centre for"],
  ["thereby making enforcing contracts easier", "making it easier to enforce contracts"],
  ["empower the Arbitration Council of India to", "let the Arbitration Council of India"], ["by establishing", "by setting up"],
  [/more user[-‑ ]friendly/g, "easier to use"], [/user[-‑ ]friendly/g, "easier to use"], [/cost[-‑ ]effective/g, "cheaper"],
  [/\bensure\b/g, "make sure"], [/\barbitral\b/g, "arbitration"], [/\bamendments\b/g, "changes"], [/\bamendment\b/g, "change"],
];
const plain = s => PLAIN.reduce((t, [a, b]) => t.replace(a, b),
  s.replace(/[\u00a0\u2009\u202f]/g, " ").replace(/[\u2010\u2011]/g, "-"));

const YEAR = { "3/2016": "2015", "33/2019": "2019", "3/2021": "2021" };
const WHEN = { "3/2016": "applies from 23 Oct 2015", "33/2019": "applied in stages from 30 Aug 2019", "3/2021": "applies from 4 Nov 2020" };
const LABEL = { added: "Added", changed: "Changed", removed: "Removed", never: "Never changed" };
const DOT = { added: "🟢", changed: "🟠", removed: "🔴" };
let ACT = null, MODE = "easy";
try { MODE = localStorage.getItem("mode") === "full" ? "full" : "easy"; } catch (e) {}
const easy = () => MODE === "easy";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const go = root => root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => location.hash = "#/" + b.dataset.go);
const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z]/g, "");
const isSch = p => p.startsWith("sch"), isPart = p => p.startsWith("pt");

function setMode(m) {
  MODE = m;
  try { localStorage.setItem("mode", m); } catch (e) {}
  document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  if (ACT) route(false);
}
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode(MODE);
const switchBtn = () => `<div class="switch"><button onclick="setMode('${easy() ? "full" : "easy"}')">${easy()
  ? "📚 Want the legal details? Switch to the Full version" : "😊 Too much detail? Switch to the Easy version"}</button></div>`;

function number(path) {   // "Rule 37" / "List 8" / "Part IA", with the lawyers' name alongside
  if (isSch(path)) { const n = +path.slice(3); return [`List ${n}`, `${["", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth"][n]} Schedule`]; }
  if (isPart(path)) return ["Part IA", "Part IA"];
  const n = path.slice(1).replace("-I", "I");
  return [`Rule ${n}`, `Section ${n}`];
}
function title(path, heading) {
  let h = TITLES[path] || heading || "";
  if (h && h === h.toUpperCase()) h = h.charAt(0) + h.slice(1).toLowerCase();
  return h.replace(/\.$/, "");
}
const question = path => QUESTIONS.find(q => q[0] === path);

fetch("api/act").then(r => r.json()).then(act => {
  ACT = act;
  act.all = act.provisions.map(p => ({ ...p, added: false })).concat(act.inserted.map(p => ({ ...p, added: true })));
  window.addEventListener("hashchange", () => route());
  route();
}).catch(() => app.innerHTML = '<p style="padding:40px 0">Sorry, the page could not load. Please refresh.</p>');

function route(top = true) {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (h) detail(h); else home();
  if (top) window.scrollTo(0, 0);
}

function status(p) { return p.added ? "added" : p.changes ? "changed" : "never"; }
function row(p) {
  const [n] = number(p.path), t = title(p.path, p.heading), s = status(p);
  return `<button class="row" data-go="${p.path}"><span class="t">${esc(n)}${t ? ` <span>· ${esc(t)}</span>` : ""}</span>
    <span class="tag ${s}">${s === "added" ? "New" : LABEL[s]}</span></button>`;
}
function qcard([p, ic, q, d]) {
  return `<button class="q" data-go="${p}"><span class="ic">${ic}</span><span><b>${esc(q)}</b><span>${esc(d)}</span></span></button>`;
}

function home() {
  const bySort = (a, b) => a.path.localeCompare(b.path, "en", { numeric: true });
  app.innerHTML = `
    <section class="hero">
      <h1>${easy() ? "What changed in this law, and why?" : "Laws change. See how, and why."}</h1>
      <p>${easy() ? "Tap a question. We'll show you what changed, and why, in simple words."
        : "Pick a question, or any part of the law. For each change you get the year, what changed, the reason given word for word, who gave it, and the legal text."}</p>
    </section>
    <div class="card"><h3>⚖️ What is this law about?</h3>
      ${easy() ? `<p>Sometimes two sides fight, say over a business deal. Instead of going to court, they can pick a
        <b>private judge</b> they both trust. That private judge is called an <b>arbitrator</b>, and this is called <b>arbitration</b>.</p>
        <p>India's rules for this are in one law from <b>1996</b>. Parliament changed it <b>3 times</b>: in 2015, 2019 and 2021.</p>`
      : `<p>The <b>Arbitration and Conciliation Act, 1996</b> sets out how disputes are settled by an arbitrator (a private
        judge both sides agree on) instead of a court. Parliament amended it by Acts passed in <b>2015</b> (Act 3 of 2016),
        <b>2019</b> (Act 33 of 2019) and <b>2021</b> (Act 3 of 2021).</p>`}</div>
    ${easy() ? `<div class="steps">
      <div class="step"><b>1️⃣</b> Tap a question</div>
      <div class="step"><b>2️⃣</b> See what changed</div>
      <div class="step"><b>3️⃣</b> See why</div>
    </div>` : ""}
    <div class="search"><input id="q" type="search" placeholder="🔍  Type a word, like: costs, appeal, secret, time" aria-label="Search"></div>
    <div id="results"></div>
    <div id="browse">
      <h2>${easy() ? "Pick a question" : "Popular questions"}</h2>
      <div class="qs">${QUESTIONS.map(qcard).join("")}</div>
      <h2>Who gives the reasons?</h2>
      <div class="card key">
        <div><span class="ic">🏛️</span><span><b>The Government.</b> ${easy() ? "The people who wrote the change." : "Its official reasons, printed in the Bill it brought to Parliament and signed by the minister."}</span></div>
        <div><span class="ic">🗣️</span><span><b>An MP.</b> ${easy() ? "A Member of Parliament, giving their own opinion." : "A Member of Parliament in the Lok Sabha debate. This is their own opinion, not the Government's."}</span></div>
        <div><span class="ic">📘</span><span><b>The Law Commission.</b> ${easy() ? "Legal experts who advise the Government." : "The expert body that advises the Government on law reform (Report No. 246 and its supplement)."}</span></div>
        <div><span class="ic">❓</span><span><b>No reason found.</b> ${easy() ? "We couldn't find one written down, so we don't guess." : "We searched the Bill, the Lok Sabha debate and (for 2015) the Law Commission's reports and found no reason we could quote. We don't guess."}</span></div>
      </div>
      ${easy() ? "" : `<h2>Every part of the law (${ACT.all.length})</h2>
        <div class="list">${ACT.all.filter(p => p.changes).sort(bySort).map(row).join("")}</div>
        <div class="list">${ACT.all.filter(p => !p.changes).map(row).join("")}</div>`}
      ${switchBtn()}
    </div>`;
  go(app);
  const q = document.getElementById("q"), res = document.getElementById("results");
  q.oninput = () => {
    const v = q.value.trim().toLowerCase();
    document.getElementById("browse").style.display = v ? "none" : "";
    if (!v) { res.innerHTML = ""; return; }
    const qs = QUESTIONS.filter(x => `${x[2]} ${x[3]}`.toLowerCase().includes(v));
    const hits = ACT.all.filter(p => `${number(p.path).join(" ")} ${title(p.path, p.heading)}`.toLowerCase().includes(v)
      || p.path.toLowerCase() === "s" + v);
    res.innerHTML = (qs.length ? `<h2>Questions</h2><div class="qs">${qs.map(qcard).join("")}</div>` : "")
      + `<h2>${easy() ? "Other things that match" : "Parts of the law"}</h2><div class="list">`
      + (hits.length ? hits.map(row).join("") : `<div class="empty">Nothing found for “${esc(q.value)}”. Try another word.</div>`) + "</div>";
    go(res);
  };
}

function kind(path) { return isSch(path) ? "list" : isPart(path) ? "part" : "rule"; }
function eventStatus(path, e) {
  if (e.edges.some(x => x.new === path && x.old == null)) return "added";
  if (e.edges.some(x => x.old === path && x.new == null)) return "removed";
  return "changed";
}
function whatHappened(path, e, st) {
  if (st === "added") return easy() ? `A new ${kind(path)} was added.` : `This ${kind(path)} was added to the law.`;
  if (st === "removed") return easy() ? `This ${kind(path)} was taken out.` : `This ${kind(path)} was taken out of the law.`;
  if (e.edges.some(x => x.old === path && x.new === path)) return easy() ? `The ${kind(path)} was rewritten.` : `This ${kind(path)} was completely rewritten.`;
  const has = { words: 0, added: 0, moved: 0, removed: 0 };
  e.edges.forEach(x => x.old == null ? has.added++ : x.new == null ? has.removed++ : x.old === x.new ? has.words++ : has.moved++);
  if (easy()) return has.added ? `The ${kind(path)} got new parts${has.words || has.moved || has.removed ? ", and some other changes" : ""}.`
    : "Some of the wording was changed.";
  const bits = [has.words && "some words were changed", has.added && "new points were added",
                has.moved && "some points were moved around", has.removed && "some points were taken out"].filter(Boolean);
  return cap(bits.join(bits.length > 2 ? ", " : " and ").replace(/, (?=[^,]*$)/, " and ")) + ".";
}

function who(it) {
  const a = it.attribution || {};
  if (a.role === "government") {
    const bill = (a.where || "").match(/Bill, (\d{4})/);
    return { ic: "🏛️", easy: "The Government said it was to:", said: "The Government said:",
      from: `Official reasons printed in the ${bill ? bill[1] + " " : ""}Bill${a.signed_by ? `, signed by Minister ${titleCase(a.signed_by)}` : ""}.` };
  }
  if (a.role === "committee")
    return { ic: "📘", easy: "The Law Commission (legal experts) said it was to:", said: "The Law Commission said:",
      from: `Law Commission of India, ${(a.by || "").replace(/^Law Commission of India,?\s*/, "")}.` };
  const m = (a.by || "").match(/^(?:SHRI|SHRIMATI|SMT\.|KUMARI|DR\.|PROF\.|ADV\.)?\s*(.*?)\s*(?:\(([^)]*)\))?$/);
  const name = m ? titleCase(m[1]) : a.by, seat = m && m[2] ? ` (MP for ${titleCase(m[2])})` : "";
  const date = (a.where || "").match(/(\d{1,2} \w{3} \d{4})/);
  return { ic: "🗣️", easy: `An MP, ${name}, said (their own opinion) it was to:`, said: `An MP, ${name}${seat}, said:`,
    from: `Debate in the Lok Sabha${date ? ", " + date[1] : ""}. This is the MP's own opinion, not the Government's official reason.` };
}

// the other parts of the law one amending section also changed (the Council's own rules
// count as one part); its reason may be about one of them
function alsoChanged(path, it) {
  const council = p => p === "pt1A" || /^s43/.test(p);
  return (it.touches || []).filter(p => p !== path && !(council(path) && council(p)));
}
function alsoNote(path, it) {
  const o = alsoChanged(path, it);
  if (!o.length || it.status !== "sourced") return "";
  const names = o.slice(0, 3).map(p => number(p)[easy() ? 0 : 1]).join(", ") + (o.length > 3 ? ` and ${o.length - 3} more` : "");
  return easy() ? `⚠️ The same change also made ${names}. This reason may be about that instead.`
    : `⚠️ The same section of the amending Act also changed ${names}; the reason given may refer to that provision rather than this one.`;
}

function why(e, path) {
  return e.intent.map(it => {
    if (it.status !== "sourced") {
      if (easy()) return `<div class="why none"><div class="lab">Why?</div><div class="who"><span class="ic">❓</span>
        <span>We couldn't find a reason written down. We don't guess.</span></div></div>`;
      const where = e.instrument === "3/2016" ? "the Bill, the debate in Parliament and the Law Commission's reports" : "the Bill and the debate in Parliament";
      return `<div class="why none"><div class="lab">Why?</div><div class="who"><span class="ic">❓</span><span>No reason found.</span></div>
        <div class="quote">We looked in ${where}, but couldn't find a reason for this change. We only show reasons we can quote word for word, so we don't guess.</div></div>`;
    }
    const w = who(it), quote = it.quote.replace(/\s+/g, " ").trim();
    if (easy()) {
      const simple = cap(plain(it.claim).replace(/^(This was done to|To) /, ""));
      const lead = /^(This|The changes)/.test(simple) ? w.easy.replace(/ it was to:$/, ":") : w.easy;
      return `<div class="why"><div class="lab">Why?</div><div class="who"><span class="ic">${w.ic}</span><span>${esc(lead)}</span></div>
        <div class="simple">${esc(simple)}</div>${alsoNote(path, it) ? `<div class="short">${esc(alsoNote(path, it))}</div>` : ""}
        <details class="text"><summary>💬 See their exact words</summary>
          <div class="quote">“${esc(quote)}”</div><div class="from">${esc(w.from)}</div></details></div>`;
    }
    return `<div class="why"><div class="lab">Why?</div><div class="who"><span class="ic">${w.ic}</span><span>${esc(w.said)}</span></div>
      <div class="quote">“${esc(quote)}”</div>
      ${norm(it.claim) === norm(quote) ? "" : `<div class="short"><b>In short:</b> ${esc(it.claim)}</div>`}
      <div class="from">Source: ${esc(w.from)}</div>${alsoNote(path, it) ? `<div class="short">${esc(alsoNote(path, it))}</div>` : ""}</div>`;
  }).join("");
}

function story(path, p) {   // "Made in 1996. Changed in 2015. Changed again in 2019."
  if (!p.events.length) return "Made in 1996, and never changed since.";
  const words = { added: "Added", removed: "Taken out" };
  return (p.in_1996 ? "Made in 1996. " : "") + p.events.map((e, i) => {
    const s = eventStatus(path, e);
    return `${words[s] || (i ? "Changed again" : "Changed")} in ${YEAR[e.instrument] || e.instrument}.`;
  }).join(" ");
}

function detail(path) {
  const back = `<button class="back" onclick="location.hash=''">← Back to questions</button>`;
  fetch(`api/provision/${encodeURIComponent(path)}`).then(r => { if (!r.ok) throw 0; return r.json(); }).then(p => {
    const q = question(path), [n, lawyer] = number(path), t = title(path, p.heading);
    let html = `${back}<div class="title"><span class="ic">${q ? q[1] : "📄"}</span><div><h1>${esc(q ? q[2] : t || n)}</h1>`;
    if (easy()) {
      html += `</div></div><div class="story">${esc(story(path, p))}</div>`;
    } else {
      const steps = (p.in_1996 ? [["1996", "never", "Original"]] : [])
        .concat(p.events.map(e => { const s = eventStatus(path, e); return [YEAR[e.instrument] || e.instrument, s, LABEL[s]]; }));
      html += `<div class="sub">This is ${esc(n)} of the arbitration law${t && q ? ` (“${esc(t)}”)` : ""}.${n !== lawyer ? ` Lawyers call it ${esc(lawyer)}.` : ""}</div></div></div>
        <div class="path">${steps.map(([y, s, l]) => `<span class="tag ${s}">${y} · ${l}</span>`).join('<span class="arrow">→</span>')}</div>`;
    }
    if (p.in_1996) {
      const original = p.nodes_1996.filter(x => x.text).map(x => (x.number && x.path !== path ? `(${x.number}) ` : "") + x.text).join("\n\n");
      html += easy()
        ? `<div class="yr">📜 1996</div><div class="card" style="margin-top:0"><div class="what">${p.events.length
            ? `The ${kind(path)} was first made.` : `The ${kind(path)} was made, and has stayed the same ever since.`}</div></div>`
        : `<div class="yr">1996 <small>the original law</small></div>
        <div class="card" style="margin-top:0"><div class="what">${p.events.length ? `This is how the ${kind(path)} first read.` : `This ${kind(path)} has never been changed since 1996.`}</div>
        ${original ? `<details class="text"><summary>📄 Show the original legal words</summary><div class="txt">${esc(original)}</div></details>` : ""}</div>`;
    }
    for (const e of p.events) {
      const st = eventStatus(path, e), y = YEAR[e.instrument] || e.instrument, words = Object.values(e.instructions).filter(Boolean).join("\n\n");
      html += easy()
        ? `<div class="yr">${DOT[st]} ${y}</div><div class="card" style="margin-top:0"><div class="what">${esc(whatHappened(path, e, st))}</div>${why(e, path)}</div>`
        : `<div class="yr">${y} <span class="tag ${st}">${LABEL[st]}</span> <small>${esc(WHEN[e.instrument] || "")}</small></div>
        <div class="card" style="margin-top:0"><div class="what">${esc(whatHappened(path, e, st))}</div>${why(e, path)}
        ${words ? `<details class="text"><summary>📄 Show the exact legal words Parliament used</summary><div class="txt">${esc(words)}</div></details>` : ""}</div>`;
    }
    if (path === "pt1A") {
      const inside = ACT.all.filter(x => /^s43[A-Z]$|^s43-I$/.test(x.path))
        .sort((a, b) => a.path.replace("-", "").localeCompare(b.path.replace("-", "")));
      html += `<h2>${easy() ? "The Council's rules" : "What's inside this part"}</h2><div class="list">${inside.map(row).join("")}</div>`;
    }
    app.innerHTML = html + switchBtn();
    go(app);
  }).catch(() => { app.innerHTML = `${back}<p>Sorry, we couldn't find that.</p>`; });
}

// ---- chat: picks the part(s) of the law a question is about, then shows their recorded
// changes and sourced reasons. With the app running locally the AI model does the picking
// (POST api/chat); on the public page the Worker named in chat.json does it (it keeps the key);
// with neither, the browser matches words.
let AI = true, NOTE = "ai", CHAT_URL = "api/chat";
fetch("chat.json").then(r => r.ok ? r.json() : null).then(c => { if (c && c.url) CHAT_URL = c.url; }).catch(() => {});
const STOP = new Set("what when where which who whom whose why how does did do is are was were can could should would will the a an of to in on for and or if my me i it this that there their they be by with about from any law rule section act arbitration arbitrator arbitral get have has change changes changed changing amendment amendments idea year".split(" "));
const OPINION = /\b(good|bad|better|worse|fair|unfair|right|wrong|should|opinion|think|agree|best|worst|benefit|harm|support|oppose)\b/i;
const OPINION_SAFE = /what if the arbitrator is unfair|is unfair\b.*\?|right to/i;
const SYN = { appeal: "challenge higher court appealable", cancel: "set aside", secret: "confidentiality", costs: "cost pays fees",
  fee: "fees costs", time: "time limit", deadline: "time limit", fast: "faster fast track", quick: "faster fast track",
  biased: "unfair neutral challenge", unfair: "neutral challenge", interim: "temporary orders", judge: "arbitrator" };
function localRoute(question) {
  const words = question.toLowerCase().match(/[a-z]+/g) || [];
  const terms = words.filter(w => w.length > 2 && !STOP.has(w) && !OPINION.test(w)).flatMap(w => [w, ...(SYN[w] || "").split(" ").filter(Boolean)]);
  const num = question.match(/\b(?:section|rule|s\.?)\s*(\d+[a-z]?)/i), sch = question.match(/\b(?:schedule|list)\s*(\d+)/i);
  const exact = num ? "s" + num[1].replace(/[a-z]$/, c => c.toUpperCase()) : sch ? "sch" + sch[1] : null;
  const kindOf = OPINION.test(question) && !OPINION_SAFE.test(question) ? "opinion" : "law";
  if (exact && ACT.all.some(p => p.path === exact)) return { kind: kindOf, paths: [exact] };
  const asked = new Set(words);   // one of the listed questions, in (nearly) the same words
  const same = QUESTIONS.find(q => { const qw = q[2].toLowerCase().match(/[a-z]+/g); return qw.filter(w => asked.has(w)).length >= qw.length * 0.8; });
  if (same) return { kind: "law", paths: [same[0]] };
  const score = new Map();
  const add = (path, text, w) => { const t = text.toLowerCase(); let n = 0;
    for (const x of new Set(terms)) if (t.includes(x)) n += x.length > 4 ? 2 : 1;
    if (n) score.set(path, (score.get(path) || 0) + n * w); };
  QUESTIONS.forEach(q => add(q[0], `${q[2]} ${q[3]}`, 2));
  ACT.all.forEach(p => add(p.path, title(p.path, p.heading), p.changes ? 1.2 : 1));
  const paths = [...score].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const top = paths.length ? score.get(paths[0]) : 0;
  return { kind: paths.length || kindOf === "opinion" ? kindOf : "other", paths: paths.filter(p => score.get(p) >= top * 0.75).slice(0, 2) };
}
async function routeQ(question) {
  if (AI) try {
    const r = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (r.ok) { const out = await r.json(); if (out.kind !== "error") { NOTE = "ai"; return out; } }
    else if ([404, 405, 501, 503].includes(r.status)) AI = false;   // no router here: stop asking
  } catch (e) { if (CHAT_URL === "api/chat") AI = false; }
  NOTE = AI ? "busy" : "words";
  return localRoute(question);
}
// chat answers: always the Easy voice (the chat is the friendly way in, whatever the switch
// says): a few short sentences assembled from the record, in fixed patterns over the same facts
// and verified reasons as the detail page; no model-written text. Legal detail is one tap away.
const listYears = ys => ys.length < 2 ? ys.join("") : ys.slice(0, -1).join(", ") + " and " + ys[ys.length - 1];
const low = s => s.charAt(0).toLowerCase() + s.slice(1);
// the one reason the chat gives: the latest stated by the Government, else the Law Commission,
// else an MP; a reason recorded for a change that also made other rules is skipped (it may be
// about them). Cut at ", which …" only, so the words left are still the record's.
function bestReason(path, p) {
  const rank = it => ({ government: 3, committee: 2 }[(it.attribution || {}).role] || 1);
  const all = p.events.flatMap(e => e.intent.map(it => ({ it, y: YEAR[e.instrument] || e.instrument })))
    .filter(x => x.it.status === "sourced" && !alsoChanged(path, x.it).length);
  return all.sort((a, b) => rank(b.it) - rank(a.it) || b.y.localeCompare(a.y))[0];
}
async function chatAnswer(path) {
  const p = await fetch(`api/provision/${encodeURIComponent(path)}`).then(r => r.json());
  const sts = p.events.map(e => [YEAR[e.instrument] || e.instrument, eventStatus(path, e)]);
  const changedYs = sts.filter(([, st]) => st === "changed").map(([y]) => y);
  const added = sts.find(([, st]) => st === "added"), removed = sts.find(([, st]) => st === "removed");
  const bits = [p.in_1996 ? "has been in the law since 1996" : added ? `was added in ${added[0]}` : "is part of the law"];
  const was = p.in_1996 ? "was " : "";
  if (changedYs.length) bits.push(`${was}changed in ${listYears(changedYs)}`);
  if (removed) bits.push(`${was}removed in ${removed[0]}`);
  if (bits.length === 1 && p.in_1996) bits.push("has never changed");
  const life = `This ${kind(path)} ` + (bits.length > 1 ? bits.slice(0, -1).join(", ") + " and " + bits[bits.length - 1] : bits[0]);
  let why = "";
  if (p.events.length) {
    const r = bestReason(path, p);
    if (!r) why = "We couldn't find a written reason.";
    else {
      const role = (r.it.attribution || {}).role, by = role === "government" ? "The Government" : role === "committee" ? "The Law Commission" : "An MP";
      const claim = plain(r.it.claim).replace(/\s+/g, " ").trim().replace(/\.$/, "").split(/, which\b/)[0];
      const aim = claim.replace(/^(?:This was done to|The amendment (?:is intended to|aims to|was made to|seeks to)|To) /i, "");
      why = `${by} said ${aim === claim ? "it " + low(claim).replace(/^this /, "") : "it was to " + low(aim)}.`;
    }
  }
  return `<p>${esc(life)}.</p>${why ? `<p>${esc(why)}</p>` : ""}<p class="r"><a data-go="${path}">More →</a></p>`;
}
const chips = () => `<div class="chips">${QUESTIONS.slice(0, 4).map(q => `<button type="button" data-ask="${esc(q[2])}">${q[1]} ${esc(q[2])}</button>`).join("")}</div>`;
function say(html, who = "bot") {
  const box = document.getElementById("chat-msgs"), m = document.createElement("div");
  m.className = "m " + who; m.innerHTML = html; box.appendChild(m); box.scrollTop = box.scrollHeight;
  m.querySelectorAll("[data-go]").forEach(a => a.onclick = () => { location.hash = "#/" + a.dataset.go; if (innerWidth < 700) toggleChat(false); });
  m.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => ask(b.dataset.ask));
  return m;
}
async function ask(text) {
  text = text.trim(); if (!text || !ACT) return;
  say(esc(text), "me");
  const wait = say("…");
  try {
    const r = await routeQ(text);
    let html;
    if (r.kind === "other") html = `<p>I only know about India's arbitration law (made in 1996, changed in 2015, 2019 and 2021). Try one of these:</p>${chips()}`;
    else if (r.kind === "opinion") html = `<p>I can't say if something is good or bad, or what should happen. That's an opinion,
      and I only repeat what the official record says. I can show you what changed and who said why:</p>${chips()}`;
    else if (!r.paths.length) html = `<p>I'm not sure which part of the law that's about. Try other words, or one of these:</p>${chips()}`;
    else html = await chatAnswer(r.paths[0]);
    wait.innerHTML = html; go(wait); wait.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", () => { if (innerWidth < 700) toggleChat(false); }));
    wait.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => ask(b.dataset.ask));
    document.getElementById("chat-note").textContent = {
      ai: "The AI only picks which rule your question is about. Every answer comes from the official record.",
      busy: "The AI helper is busy, so I matched your words to the law this time. I never make up a reason.",
      words: "I matched your words to the law (the AI helper isn't available here). I never make up a reason.",
    }[NOTE];
  } catch (e) { wait.innerHTML = "Sorry, something went wrong. Please try again."; }
  document.getElementById("chat-msgs").scrollTop = 1e9;
}
function toggleChat(open) {
  document.getElementById("chat").hidden = !open;
  document.getElementById("chat-open").hidden = open;
  if (open) {
    if (!document.getElementById("chat-msgs").children.length)
      say(`<p>Hi! Ask me anything about India's arbitration law, like:</p>${chips()}`);
    document.getElementById("chat-in").focus();
  }
}
document.getElementById("chat-open").onclick = () => toggleChat(true);
document.getElementById("chat-close").onclick = () => toggleChat(false);
document.getElementById("chat-form").onsubmit = ev => { ev.preventDefault(); const i = document.getElementById("chat-in"); ask(i.value); i.value = ""; };
</script>
</body>
</html>
